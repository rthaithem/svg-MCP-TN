# Cloudflare Pages / Workers Configuration for svg-MCP-TN
name = "svg-mcp-tn"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
MCP_SERVER_NAME = "svg-mcp-tn"
MCP_VERSION = "1.0.0"
ENVIRONMENT = "production"

# Observability and edge logs
[observability]
enabled = true
